name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run prettier
      - run: npm test

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view userscript-latest ||
            gh release create userscript-latest \
              --target "${{ github.sha }}" \
              --title 'UserScript (latest)' \
              --notes 'Latest userscript build.'
          gh release upload userscript-latest --clobber dist/*.user.js

      - run: bash ./scripts/publish.sh

      - if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
