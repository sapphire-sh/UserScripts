name: build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run prettier
      - run: npm test

  publish:
    needs: [check]
    uses: sapphire-sh/github-actions/.github/workflows/userscript-publish-template.yml@main
    with:
      assets: dist/*.user.js

  notify:
    needs: [check, publish]
    if: always()
    permissions:
      contents: read
    uses: sapphire-sh/github-actions/.github/workflows/notify-template.yml@main
    with:
      result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      context: ${{ github.repository }}
      job: build
      runner: ubuntu-latest
    secrets: inherit
