name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run prettier
      - run: npm test

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view userscript-latest ||
            gh release create userscript-latest \
              --target "${{ github.sha }}" \
              --title 'UserScript (latest)' \
              --notes 'Latest userscript build.'
          gh release upload userscript-latest --clobber dist/*.user.js

      - run: bash ./scripts/publish.sh

  notify:
    needs: [build]
    if: always()
    permissions:
      contents: read
    uses: sapphire-sh/github-actions/.github/workflows/notify-template.yml@main
    with:
      result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      context: ${{ github.repository }}
      job: build
      runner: ubuntu-latest
    secrets: inherit
